workspace = "personal"
project = "dotfiles"
project_strategy = "repo-root"

[capture]
ignore_paths = [
  ".env",
  ".env.*",
  "**/.env",
  "**/.env.*",
  "*.pem",
  "*.key",
  "*.p12",
  "*.pfx",
  "**/*.pem",
  "**/*.key",
  "**/*.p12",
  "**/*.pfx",
  "secrets/**",
  "credentials/**",
  "**/secrets/**",
  "**/credentials/**",
  "~/.ssh/**",
  "~/.gnupg/**",
  "~/.aws/**",
  "~/.password-store/**",
]
